<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="560" fill="#f7f9fb"/>
  <rect x="0" y="0" width="900" height="560" fill="none" stroke="#d7e0e7"/>

  <text x="28" y="44" font-size="13" font-weight="700" letter-spacing=".5" fill="#087a73">SERVICES/CACHE · REVISION 2</text>
  <text x="28" y="86" font-size="32" font-weight="700" fill="#17212b">Stampede guard</text>
  <rect x="28" y="104" width="60" height="26" rx="13" fill="#e5f4f2"/>
  <text x="42" y="121" font-size="13" fill="#08635f">cache</text>
  <rect x="94" y="104" width="88" height="26" rx="13" fill="#e5f4f2"/>
  <text x="108" y="121" font-size="13" fill="#08635f">reliability</text>

  <rect x="28" y="148" width="600" height="270" fill="#ffffff" stroke="#d7e0e7"/>
  <text x="46" y="178" font-size="13" fill="#536271" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Switched from one global lock to 16 striped locks keyed by hash so</text>
  <text x="46" y="198" font-size="13" fill="#536271" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">unrelated cache keys no longer contend on the same mutex under load.</text>
  <text x="46" y="230" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">func guarded(key string, cache map[string]string, origin func(string) string) string {</text>
  <text x="46" y="252" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    lock := stripe(key)</text>
  <text x="46" y="274" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    lock.Lock()</text>
  <text x="46" y="296" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    defer lock.Unlock()</text>
  <text x="46" y="318" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    if v, ok := cache[key]; ok { return v }</text>
  <text x="46" y="340" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    v := origin(key); cache[key] = v; return v</text>
  <text x="46" y="362" font-size="13" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">}</text>

  <text x="28" y="440" font-size="13" fill="#607482">Viewing a revision? </text>
  <text x="150" y="440" font-size="13" font-weight="700" fill="#075f5b">Return to latest</text>

  <!-- history sidebar -->
  <line x1="660" y1="20" x2="660" y2="540" stroke="#d7e0e7"/>
  <text x="684" y="44" font-size="13" font-weight="700" letter-spacing=".5" fill="#607482">HISTORY</text>

  <text x="696" y="80" font-size="16" font-weight="700" fill="#075f5b">Revision 2</text>
  <text x="696" y="100" font-size="12" fill="#607482">Aug 27, 2026, 9:17 PM</text>
  <rect x="684" y="66" width="4" height="42" fill="#0d9488"/>

  <text x="696" y="140" font-size="16" fill="#075f5b">Revision 1</text>
  <text x="696" y="160" font-size="12" fill="#607482">Aug 27, 2026, 9:17 PM</text>

  <text x="684" y="480" font-size="12" fill="#607482">Stable short link:</text>
  <text x="684" y="500" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">/V8ag9Pvv8</text>
</svg>
