  <!-- content -->
  <text x="296" y="266" font-size="12" font-weight="700" letter-spacing=".5" fill="#087a73">SERVICES/CACHE · REVISION 2</text>
  <text x="296" y="300" font-size="26" font-weight="700" fill="#17212b">Stampede guard</text>
  <rect x="296" y="316" width="52" height="22" rx="11" fill="#e5f4f2"/>
  <text x="308" y="331" font-size="12" fill="#08635f">cache</text>
  <rect x="354" y="316" width="76" height="22" rx="11" fill="#e5f4f2"/>
  <text x="366" y="331" font-size="12" fill="#08635f">reliability</text>

  <rect x="296" y="352" width="668" height="230" fill="#ffffff" stroke="#d7e0e7"/>
  <text x="312" y="378" font-size="12" fill="#536271" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Switched from one global lock to 16 striped locks keyed by hash so</text>
  <text x="312" y="396" font-size="12" fill="#536271" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">unrelated cache keys no longer contend on the same mutex under load.</text>
  <text x="312" y="424" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">func guarded(key string, cache map[string]string, origin func(string) string) string {</text>
  <text x="312" y="442" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    lock := stripe(key)</text>
  <text x="312" y="460" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    lock.Lock()</text>
  <text x="312" y="478" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    defer lock.Unlock()</text>
  <text x="312" y="496" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    if v, ok := cache[key]; ok { return v }</text>
  <text x="312" y="514" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">    v := origin(key); cache[key] = v; return v</text>
  <text x="312" y="532" font-size="12" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">}</text>
  <text x="296" y="602" font-size="12" fill="#607482">Viewing a revision? </text>
  <text x="406" y="602" font-size="12" fill="#075f5b" font-weight="700">Return to latest</text>

